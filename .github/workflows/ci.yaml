name: CI
on: [ push, pull_request ]
env:
  # Common versions
  GO_VERSION: '1.24.6'
  GOLANGCI_VERSION: 'v2.2.2'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # The golangci-lint action does its own caching.

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          # The default install-mode downloads a release binary from GitHub,
          # and that download has been failing: "prepare environment / Error:
          # Unexpected HTTP response: 504". It is the whole reason the lint
          # job has been red — the tree itself lints clean — and it is
          # intermittent, which is why the job passed 9 of its last 30 runs
          # with nobody able to tell which failures were real.
          #
          # goinstall builds it from the Go module proxy instead: different
          # infrastructure, and the one every other step here already depends
          # on. It costs a compile on a cold cache and buys a signal that
          # means something.
          install-mode: goinstall

  unit-test:
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supersecret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Unit Tests
        run: go test -v -cover ./...
        env:
          POSTGRES_HOST: localhost
